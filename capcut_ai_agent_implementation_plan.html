
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .root { padding: 1.5rem 0; }

  .header { margin-bottom: 1.5rem; }
  .header h1 { font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--text-muted); }

  .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: var(--radius); border: 0.5px solid var(--border); font-size: 13px; cursor: pointer; color: var(--text-secondary); background: transparent; transition: all 0.15s; }
  .tab:hover { background: var(--surface-1); color: var(--text-primary); }
  .tab.active { background: var(--surface-1); border-color: var(--border-strong); color: var(--text-primary); font-weight: 500; }

  .phase-card { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1rem; }
  .phase-header { padding: 1rem 1.25rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .phase-badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
  .phase-title { font-size: 15px; font-weight: 500; color: var(--text-primary); flex: 1; }
  .phase-meta { font-size: 12px; color: var(--text-muted); }

  .steps-list { padding: 0; }
  .step-item { padding: 0.85rem 1.25rem; border-bottom: 0.5px solid var(--border); display: flex; gap: 12px; align-items: flex-start; cursor: pointer; transition: background 0.1s; }
  .step-item:last-child { border-bottom: none; }
  .step-item:hover { background: var(--surface-1); }
  .step-item.expanded { background: var(--surface-1); }
  .step-num { font-size: 11px; color: var(--text-muted); font-weight: 500; min-width: 20px; margin-top: 2px; }
  .step-content { flex: 1; }
  .step-name { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
  .step-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .step-arrow { font-size: 12px; color: var(--text-muted); margin-top: 2px; transition: transform 0.2s; }
  .step-item.expanded .step-arrow { transform: rotate(90deg); }

  .json-block { background: var(--surface-0); border-top: 0.5px solid var(--border); padding: 1rem 1.25rem; display: none; position: relative; }
  .json-block.visible { display: block; }
  .json-block pre { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-primary); line-height: 1.7; overflow-x: auto; white-space: pre; }
  .copy-btn { position: absolute; top: 10px; right: 12px; font-size: 11px; padding: 4px 10px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-2); color: var(--text-secondary); cursor: pointer; }
  .copy-btn:hover { background: var(--surface-1); color: var(--text-primary); }

  .sk { color: #7c5cbf; }
  .sv { color: #2d7a4f; }
  .sn { color: #c7522a; }
  .sb { color: #185fa5; }
  .sm { color: var(--text-muted); }

  .stack-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .tag-blue { background: #E6F1FB; color: #0C447C; }
  .tag-teal { background: #E1F5EE; color: #085041; }
  .tag-amber { background: #FAEEDA; color: #633806; }
  .tag-purple { background: #EEEDFE; color: #3C3489; }
  .tag-coral { background: #FAECE7; color: #712B13; }
  @media (prefers-color-scheme: dark) {
    .tag-blue { background: #0C447C; color: #B5D4F4; }
    .tag-teal { background: #085041; color: #9FE1CB; }
    .tag-amber { background: #633806; color: #FAC775; }
    .tag-purple { background: #3C3489; color: #CECBF6; }
    .tag-coral { background: #712B13; color: #F5C4B3; }
  }
</style>

<div class="root">
  <div class="header">
    <h1>AI agent — CapCut clone implementation plan</h1>
    <p>Structured JSON prompts for each agent phase. Click any step to expand its prompt.</p>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" onclick="switchPhase(0)">Phase 1 — Setup</button>
    <button class="tab" onclick="switchPhase(1)">Phase 2 — Editor</button>
    <button class="tab" onclick="switchPhase(2)">Phase 3 — Upscaling</button>
    <button class="tab" onclick="switchPhase(3)">Phase 4 — Export</button>
    <button class="tab" onclick="switchPhase(4)">Phase 5 — Auth & Storage</button>
  </div>

  <div id="phase-container"></div>
</div>

<script>
const phases = [
  {
    title: "Project setup & architecture",
    badge: "Phase 1",
    badgeColor: "#E6F1FB",
    badgeText: "#0C447C",
    duration: "Day 1–2",
    steps: [
      {
        name: "Initialize Next.js + Firebase project",
        desc: "Scaffold app router, configure Firebase SDK, set up env vars",
        tags: [["Next.js 14","blue"],["Firebase","amber"],["Vercel","blue"]],
        json: {
          agent: "setup",
          task: "scaffold_project",
          prompt: "Create a Next.js 14 (App Router) project with the following structure:\n- /app layout with Firebase provider\n- /lib/firebase.ts with Auth, Firestore, Storage init\n- .env.local with all Firebase config keys\n- vercel.json with proper build config\n- tailwind.config.ts with custom design tokens",
          constraints: {
            framework: "Next.js 14 App Router",
            firebase_version: "^10.x",
            node_version: ">=18",
            deploy_target: "Vercel"
          },
          output_files: [
            "app/layout.tsx",
            "lib/firebase.ts",
            "lib/firebase-admin.ts",
            ".env.local.example",
            "vercel.json"
          ],
          validation: "yarn build must pass with zero type errors"
        }
      },
      {
        name: "Firestore schema design",
        desc: "Define collections: users, projects, clips, exports, jobs",
        tags: [["Firestore","amber"],["Schema","teal"]],
        json: {
          agent: "database",
          task: "design_schema",
          prompt: "Design Firestore schema for a video editor app. Include:\n- users/{uid}: profile, plan, storage_used_bytes\n- projects/{pid}: owner_uid, title, fps, resolution, timeline[], created_at\n- projects/{pid}/clips/{cid}: file_url, duration_ms, trim_start, trim_end, position_ms, layer\n- exports/{eid}: project_id, status, output_url, upscale_applied, created_at\n- jobs/{jid}: type (export|upscale), status, progress, error",
          security_rules: {
            users: "read/write own doc only",
            projects: "owner_uid == request.auth.uid",
            clips: "inherit from parent project",
            exports: "owner can read; functions can write",
            jobs: "owner can read; functions can write"
          },
          indexes: ["projects by owner_uid+created_at", "jobs by status+created_at"],
          output_files: ["firestore.rules", "firestore.indexes.json", "lib/schema.ts"]
        }
      },
      {
        name: "Firebase Storage rules + CORS",
        desc: "Configure storage buckets, upload paths, CORS for browser direct upload",
        tags: [["Firebase Storage","amber"],["CORS","coral"]],
        json: {
          agent: "storage",
          task: "configure_storage",
          prompt: "Set up Firebase Storage for browser-based video upload:\n- Storage paths: users/{uid}/raw/{filename}, users/{uid}/exports/{filename}\n- Rules: only authenticated user can read/write own path\n- Max upload size: 2GB\n- CORS: allow GET/PUT from localhost:3000 and production domain\n- Generate presigned upload URL server action in /app/actions/upload.ts",
          cors_origins: ["http://localhost:3000", "https://your-app.vercel.app"],
          output_files: ["storage.rules", "cors.json", "app/actions/upload.ts"]
        }
      }
    ]
  },
  {
    title: "Video editor UI & timeline",
    badge: "Phase 2",
    badgeColor: "#E1F5EE",
    badgeText: "#085041",
    duration: "Day 3–8",
    steps: [
      {
        name: "Canvas-based video preview",
        desc: "Build compositing canvas that renders timeline clips using HTMLVideoElement",
        tags: [["Canvas API","teal"],["React","blue"],["WebCodecs","purple"]],
        json: {
          agent: "editor",
          task: "build_preview_canvas",
          prompt: "Build a React component <VideoPreview> that:\n- Accepts a timeline[] of clips with position_ms, trim_start, trim_end, layer\n- Uses an offscreen canvas for compositing\n- Plays multiple video layers in sync using HTMLVideoElement + requestVideoFrameCallback\n- Renders text overlays using canvas 2D API\n- Exposes seekTo(ms), play(), pause() via useImperativeHandle\n- Outputs at target resolution (480p preview, 1080p export)",
          component_props: {
            timeline: "ClipTrack[]",
            resolution: "{ width: number, height: number }",
            currentTime: "number (ms)",
            onTimeUpdate: "(ms: number) => void"
          },
          performance: "target 30fps on integrated GPU, use OffscreenCanvas + worker",
          output_files: ["components/editor/VideoPreview.tsx", "workers/compositor.worker.ts"]
        }
      },
      {
        name: "Timeline scrubber component",
        desc: "Drag-to-trim, split, reorder clips on a pixel-per-ms timeline",
        tags: [["React","blue"],["Drag API","teal"]],
        json: {
          agent: "editor",
          task: "build_timeline",
          prompt: "Build a <Timeline> component:\n- Horizontal scrollable track area, 1px = 10ms zoom default\n- Clips rendered as colored rectangles with thumbnail previews\n- Drag handles on clip edges for trim (left=trim_start, right=trim_end)\n- Drag clip body to reorder/move position_ms\n- Playhead that syncs with VideoPreview currentTime\n- Click to place playhead and seekTo()\n- Support multiple layers (video, audio, text) as stacked tracks\n- Keyboard: Space=play/pause, S=split at playhead, Delete=remove selected",
          state_management: "Zustand store: useEditorStore with timeline[], selectedClipId, currentTime",
          output_files: ["components/editor/Timeline.tsx", "store/editorStore.ts", "lib/timeline-utils.ts"]
        }
      },
      {
        name: "Text overlay & sticker tool",
        desc: "Add draggable text layers with font, size, color, animation controls",
        tags: [["Canvas 2D","teal"],["React","blue"]],
        json: {
          agent: "editor",
          task: "build_overlay_tools",
          prompt: "Build text and sticker overlay system:\n- <TextLayer> component: draggable/resizable text box on preview canvas\n- Font selector (Google Fonts via API), size, color, opacity, alignment\n- Animation presets: fade-in, slide-up, typewriter\n- Keyframe system: store x,y,scale,opacity at timestamps in Firestore\n- Sticker picker: emoji grid + custom image upload\n- Canvas renderer: drawLayer(ctx, layer, currentTimeMs) function",
          data_model: {
            type: "text | sticker | image",
            content: "string | url",
            x: "number (0-1 normalized)",
            y: "number (0-1 normalized)",
            scale: "number",
            start_ms: "number",
            end_ms: "number",
            animation: "fade | slide | typewriter | none"
          },
          output_files: ["components/editor/TextLayer.tsx", "lib/overlay-renderer.ts"]
        }
      },
      {
        name: "Audio track & waveform",
        desc: "Display waveform, add background music, volume envelope",
        tags: [["Web Audio API","purple"],["Canvas","teal"]],
        json: {
          agent: "editor",
          task: "build_audio_track",
          prompt: "Build audio layer for editor:\n- Decode audio from video clip using Web Audio API (AudioContext.decodeAudioData)\n- Render waveform to canvas as thumbnail in timeline track\n- Add separate music track: upload audio file, position on timeline\n- Volume envelope: draggable keyframe points on audio track\n- Master volume slider\n- Mix audio sources on export using OfflineAudioContext",
          output_files: ["components/editor/AudioTrack.tsx", "lib/audio-processor.ts", "workers/waveform.worker.ts"]
        }
      }
    ]
  },
  {
    title: "WebGPU video upscaling",
    badge: "Phase 3",
    badgeColor: "#EEEDFE",
    badgeText: "#3C3489",
    duration: "Day 9–12",
    steps: [
      {
        name: "WebGPU + WebSR integration",
        desc: "Initialize @websr/websr, detect WebGPU support, fall back to WebGL",
        tags: [["WebGPU","purple"],["@websr/websr","purple"],["WebGL fallback","blue"]],
        json: {
          agent: "upscale",
          task: "init_webgpu_upscaler",
          prompt: "Integrate @websr/websr for browser-side video upscaling:\n1. Install: npm i @websr/websr\n2. Build useUpscaler() hook:\n   - Try WebSR.initWebGPU(), fall back to WebGL if unsupported\n   - Load weights: anime4k/cnn-2x-s for preview, cnn-2x-l for export\n   - Expose: { ready, upscaleFrame(videoEl, canvas), mode: 'webgpu'|'webgl'|'unsupported' }\n3. Add <UpscaleToggle> button in editor toolbar\n4. When enabled, preview canvas uses upscaled output\n5. Show GPU mode badge: 'WebGPU', 'WebGL (slower)', or 'Not supported'",
          weights_strategy: "lazy-load weights JSON on first toggle, cache in IndexedDB",
          browser_support: {
            chrome_edge: "WebGPU native",
            firefox_safari: "WebGL fallback (2-3x slower, same quality)",
            mobile: "detect and warn — integrated GPU may be too slow"
          },
          output_files: ["hooks/useUpscaler.ts", "components/editor/UpscaleToggle.tsx", "lib/websr-loader.ts"]
        }
      },
      {
        name: "Frame-by-frame export upscaling",
        desc: "Use WebCodecs to decode, upscale each frame via WebGPU, re-encode to H.264",
        tags: [["WebCodecs","blue"],["WebGPU","purple"],["H.264","coral"]],
        json: {
          agent: "upscale",
          task: "build_export_pipeline",
          prompt: "Build frame-accurate export pipeline with upscaling:\n1. Use VideoDecoder (WebCodecs) to decode source clip frame by frame\n2. For each decoded VideoFrame:\n   a. Paint to OffscreenCanvas\n   b. Pass to websr.render() for upscaling\n   c. Read upscaled canvas pixels\n   d. Create new VideoFrame from upscaled data\n3. Feed upscaled frames to VideoEncoder (H.264, target bitrate)\n4. Mux with audio using mp4-muxer library\n5. Stream progress: onProgress(frame, totalFrames)\n6. Output: Blob of final .mp4",
          libraries: ["@websr/websr", "mp4-muxer", "WebCodecs (native browser API)"],
          performance_notes: "Run in Web Worker with OffscreenCanvas to avoid blocking UI. Target: 1080p at ~0.5-1s per frame on mid-range GPU.",
          output_files: ["workers/export-upscale.worker.ts", "lib/mp4-muxer.ts", "lib/export-pipeline.ts"]
        }
      },
      {
        name: "Upscale progress UI",
        desc: "Show frame counter, time remaining, cancel button during export",
        tags: [["React","blue"],["Web Workers","teal"]],
        json: {
          agent: "upscale",
          task: "build_progress_ui",
          prompt: "Build <ExportProgressModal> component:\n- Full-screen overlay with progress bar\n- Show: 'Upscaling frame X of Y', estimated time remaining\n- Preview thumbnail of last upscaled frame\n- Cancel button: terminates worker, cleans up VideoDecoder/Encoder\n- On complete: show download button + Firebase Storage upload option\n- Error state: show error message + retry button",
          worker_messages: {
            progress: "{ type: 'progress', frame: number, total: number, previewBlob: Blob }",
            complete: "{ type: 'complete', outputBlob: Blob }",
            error: "{ type: 'error', message: string }"
          },
          output_files: ["components/export/ExportProgressModal.tsx", "hooks/useExportWorker.ts"]
        }
      }
    ]
  },
  {
    title: "Export & ffmpeg.wasm",
    badge: "Phase 4",
    badgeColor: "#FAEEDA",
    badgeText: "#633806",
    duration: "Day 13–16",
    steps: [
      {
        name: "ffmpeg.wasm basic export",
        desc: "Non-upscaled export path: composite timeline to mp4 using ffmpeg.wasm",
        tags: [["ffmpeg.wasm","amber"],["Web Worker","teal"]],
        json: {
          agent: "export",
          task: "build_ffmpeg_export",
          prompt: "Build ffmpeg.wasm export for non-upscaled output:\n1. Load @ffmpeg/ffmpeg in a Web Worker (avoid SharedArrayBuffer issues)\n2. Write each clip blob to ffmpeg virtual FS\n3. Build ffmpeg filter_complex command:\n   - Trim: -ss trim_start -to trim_end per clip\n   - Concat video tracks\n   - Overlay text using drawtext filter\n   - Mix audio tracks with amix\n4. Run ffmpeg.exec() and read output.mp4\n5. Transfer ArrayBuffer back to main thread\n6. Show progress via ffmpeg.on('progress', cb)",
          ffmpeg_command_template: "ffmpeg -i input0.mp4 -i input1.mp4 [complex filter_complex] -c:v libx264 -preset fast -crf 23 output.mp4",
          limitations: "Inform user: 1min video ~= 2-3min processing. For clips over 3min, recommend server export.",
          output_files: ["workers/ffmpeg-export.worker.ts", "lib/ffmpeg-commands.ts"]
        }
      },
      {
        name: "Export settings panel",
        desc: "Resolution, quality, format selector before triggering export",
        tags: [["React","blue"],["UI","teal"]],
        json: {
          agent: "export",
          task: "build_export_settings",
          prompt: "Build <ExportSettings> panel:\n- Resolution: 480p / 720p / 1080p / 4K (4K only if upscale enabled)\n- Quality: Draft (CRF 28) / Standard (CRF 23) / High (CRF 18)\n- Format: MP4 (H.264) only for now\n- Upscale toggle: enable WebGPU upscaling (shows GPU mode badge)\n- Estimated file size preview based on resolution+quality+duration\n- Export button: validates settings, dispatches to correct worker\n- Save to Firebase toggle: auto-upload after export",
          output_files: ["components/export/ExportSettings.tsx", "lib/export-estimator.ts"]
        }
      }
    ]
  },
  {
    title: "Auth, storage & project management",
    badge: "Phase 5",
    badgeColor: "#FAECE7",
    badgeText: "#712B13",
    duration: "Day 17–20",
    steps: [
      {
        name: "Firebase Auth flow",
        desc: "Google sign-in, anonymous guest mode, auth guard on editor routes",
        tags: [["Firebase Auth","amber"],["Next.js","blue"]],
        json: {
          agent: "auth",
          task: "build_auth_flow",
          prompt: "Implement Firebase Auth in Next.js App Router:\n1. Google OAuth provider (signInWithPopup)\n2. Guest/anonymous mode: signInAnonymously, allow editing but prompt to save\n3. Auth context: useAuth() hook exposing { user, loading, signIn, signOut }\n4. Route guard: middleware.ts that redirects /editor/* to /login if no session\n5. Persist session with Firebase session cookies (server-side via firebase-admin)\n6. Profile page: avatar, display name, storage usage (from Firestore users doc)",
          output_files: ["lib/auth.ts", "app/login/page.tsx", "middleware.ts", "hooks/useAuth.ts", "app/actions/auth.ts"]
        }
      },
      {
        name: "Project save & load",
        desc: "Auto-save timeline state to Firestore, list projects on dashboard",
        tags: [["Firestore","amber"],["React","blue"]],
        json: {
          agent: "storage",
          task: "build_project_persistence",
          prompt: "Build project save/load system:\n1. Auto-save: debounced 2s after any timeline change, write to Firestore projects/{pid}\n2. Save indicator: 'Saving...' / 'Saved' / 'Error' badge in header\n3. Project dashboard (/dashboard): grid of project cards with thumbnail, title, last edited\n4. Thumbnail: capture first frame of first clip as 320x180 JPEG, store in Firebase Storage\n5. Duplicate project: deep copy Firestore doc + Storage files\n6. Delete project: batch delete Firestore docs + Storage files\n7. Share link: generate public read token, store in project doc",
          realtime_sync: "Use Firestore onSnapshot for live sync if user has editor open on multiple tabs",
          output_files: ["hooks/useProjectSync.ts", "app/dashboard/page.tsx", "app/actions/project.ts", "lib/thumbnail.ts"]
        }
      },
      {
        name: "Video upload with progress",
        desc: "Direct browser → Firebase Storage upload, extract metadata (duration, resolution)",
        tags: [["Firebase Storage","amber"],["File API","teal"]],
        json: {
          agent: "storage",
          task: "build_upload_flow",
          prompt: "Build media upload pipeline:\n1. <UploadZone> component: drag-and-drop or click to select video/audio files\n2. Validate: max 2GB, accept mp4/mov/webm/avi/mp3/wav\n3. Upload direct to Firebase Storage using uploadBytesResumable (no Vercel proxy)\n4. Show upload progress bar per file\n5. On complete: extract metadata client-side using HTMLVideoElement:\n   - duration_ms, width, height, has_audio\n6. Write clip doc to Firestore with file_url + metadata\n7. Add clip to current project timeline automatically",
          multi_file: "Support uploading multiple files at once, queue them sequentially",
          output_files: ["components/editor/UploadZone.tsx", "hooks/useUpload.ts", "lib/media-metadata.ts"]
        }
      }
    ]
  }
];

let currentPhase = 0;
let expandedStep = null;

function switchPhase(idx) {
  currentPhase = idx;
  expandedStep = null;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i === idx));
  render();
}

function toggleStep(phaseIdx, stepIdx) {
  const key = `${phaseIdx}-${stepIdx}`;
  expandedStep = expandedStep === key ? null : key;
  render();
}

function copyJson(phaseIdx, stepIdx) {
  const json = phases[phaseIdx].steps[stepIdx].json;
  navigator.clipboard.writeText(JSON.stringify(json, null, 2));
  const btn = document.getElementById(`copy-${phaseIdx}-${stepIdx}`);
  if(btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
}

function colorizeJson(obj, indent) {
  const str = JSON.stringify(obj, null, 2);
  return str
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="sk">$1</span>$2')
    .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="sv">$1</span>')
    .replace(/:\s*(\d+(?:\.\d+)?)/g, ': <span class="sn">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="sb">$1</span>');
}

function tagClass(color) {
  const map = { blue:'tag-blue', teal:'tag-teal', amber:'tag-amber', purple:'tag-purple', coral:'tag-coral' };
  return map[color] || 'tag-blue';
}

function render() {
  const p = phases[currentPhase];
  let html = `<div class="phase-card">
    <div class="phase-header">
      <span class="phase-badge" style="background:${p.badgeColor};color:${p.badgeText}">${p.badge}</span>
      <span class="phase-title">${p.title}</span>
      <span class="phase-meta">${p.duration}</span>
    </div>
    <div class="steps-list">`;

  p.steps.forEach((step, si) => {
    const key = `${currentPhase}-${si}`;
    const isExpanded = expandedStep === key;
    html += `<div>
      <div class="step-item${isExpanded?' expanded':''}" onclick="toggleStep(${currentPhase},${si})">
        <span class="step-num">${String(si+1).padStart(2,'0')}</span>
        <div class="step-content">
          <div class="step-name">${step.name}</div>
          <div class="step-desc">${step.desc}</div>
          <div class="stack-tags">${step.tags.map(([t,c])=>`<span class="tag ${tagClass(c)}">${t}</span>`).join('')}</div>
        </div>
        <span class="step-arrow">›</span>
      </div>
      <div class="json-block${isExpanded?' visible':''}">
        <button class="copy-btn" id="copy-${currentPhase}-${si}" onclick="event.stopPropagation();copyJson(${currentPhase},${si})">Copy</button>
        <pre>${colorizeJson(step.json)}</pre>
      </div>
    </div>`;
  });

  html += `</div></div>`;
  document.getElementById('phase-container').innerHTML = html;
}

render();
</script>
